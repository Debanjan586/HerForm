<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>HERFORM — Workout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/experience.css" />
<link rel="stylesheet" href="css/ui.css" />
<script src="js/theme.js"></script>
<script src="js/ui.js"></script>
</head>
<body>
  <div class="app-shell">
    <div class="top-bar">
      <a href="index.html" style="display:flex;align-items:center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <div class="greeting" style="font-size:1.2rem;" id="pageTitle">Workout</div>
      <div style="width:22px;"></div>
    </div>

    <div class="page" style="padding-top:0;" id="content">
      <div class="loading-spinner"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/day-lock.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const day = params.get('day');

    (async function init() {
      const user = await requireUserAuth();
      if (!user) return;

      const content = document.getElementById('content');

      // Only the current day can be opened; every other day is locked.
      try {
        if (day && !(await isDayOpenable(day))) { ui.go('program.html'); return; }
      } catch (e) { /* fall through; the fetch below reports real errors */ }

      if (!day) {
        content.innerHTML = `<div class="error-state">No workout day was specified. Please open this page from the Home tab.</div>`;
        return;
      }

      try {
        const { workout } = await api.getWorkoutByDay(day);
        document.getElementById('pageTitle').textContent = `Day ${workout.day}`;

        if (workout.isRestDay || workout.exercises.length === 0) {
          content.innerHTML = `
            <div class="card">
              <span class="tag tag-rest">Rest / Recovery</span>
              <div class="card-title" style="margin-top:10px;">${workout.title}</div>
              <p class="exercise-meta">Today is about recovery. Gentle movement, hydration, and rest help your body adapt and come back stronger tomorrow.</p>
            </div>`;
          return;
        }

        const totalSets = workout.exercises.reduce((sum, e) => sum + e.sets, 0);

        content.innerHTML = `
          <div class="card">
            <div class="card-title">${workout.title}</div>
            <div class="exercise-meta">${workout.exercises.length} exercises · ${totalSets} total sets</div>
          </div>

          <div class="card" id="exerciseList">
            ${workout.exercises
              .map(
                (entry) => `
              <div class="exercise-item">
                <div class="exercise-thumb">
                  ${entry.exercise.imageUrl ? `<img src="${entry.exercise.imageUrl}" alt="${entry.exercise.name}" />` : ''}
                </div>
                <div class="exercise-info">
                  <div class="exercise-name">${entry.exercise.name}</div>
                  <div class="exercise-meta">${
                    entry.setTimings && entry.setTimings.length
                      ? `${entry.sets} ${entry.sets === 1 ? 'set' : 'sets'} · ${entry.setTimings.map((t) => t + 's').join(' / ')}`
                      : `${entry.sets} sets × ${entry.workSeconds}s ${entry.reps ? `(${entry.reps})` : ''}`
                  }</div>
                </div>
              </div>`
              )
              .join('')}
          </div>

          <button class="btn btn-primary btn-full" id="readyBtn" style="margin-top:8px;">Ready?</button>
        `;

        document.getElementById('readyBtn').addEventListener('click', () => {
          ui.go(`workout-player.html?day=${day}`);
        });
      } catch (err) {
        content.innerHTML = `<div class="error-state">Could not load workout. ${err.message}</div>`;
      }
    })();
  </script>
</body>
</html>
