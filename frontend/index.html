<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>HERFORM — Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/experience.css" />
<link rel="stylesheet" href="css/home.css" />
<link rel="stylesheet" href="css/flame.css" />
<link rel="stylesheet" href="css/ui.css" />
<script src="js/theme.js"></script>
<script src="js/ui.js"></script>
</head>
<body>
  <div class="app-shell" id="appShell" style="display:none;">
    <div class="top-bar">
      <div>
        <div class="greeting" id="greetingText">Hello</div>
        <div class="greeting-sub" id="weekText">Week 1</div>
      </div>
      <div class="top-bar-actions">
        <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle dark mode">
          <svg class="theme-icon theme-icon-sun" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg class="theme-icon theme-icon-moon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
        </button>
        <a class="avatar-btn" href="profile.html">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
        </a>
      </div>
    </div>

    <div class="page" style="padding-top:0;">
      <!-- Motivational quote -->
      <div id="quoteSection"></div>

      <!-- Today + upcoming cards: horizontal scroll row -->
      <div class="section-heading">This Week's Workouts</div>
      <div class="day-card-scroll" id="dayCardScroll"></div>

      <!-- 7-day weekly tracker -->
      <div class="card week-tracker-card">
        <div class="card-title">Weekly Goal</div>
        <div class="week-dots" id="weekDots"></div>
      </div>

      <!-- Weekly + program stats -->
      <div class="card">
        <div class="card-title">This Week</div>
        <div class="stat-grid">
          <div class="stat-chip">
            <div class="stat-value" id="weeklyCompletedStat">0</div>
            <div class="stat-label">Workouts Done</div>
          </div>
          <div class="stat-chip">
            <div class="stat-value" id="programProgressStat">0%</div>
            <div class="stat-label">Program Progress</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Streak banner: bottom of page, hidden until first completion -->
    <div class="streak-banner" id="streakBanner">
      <div class="streak-flame-wrap" id="streakFlameWrap">
        <div id="streakFlame"></div>
      </div>
      <div class="streak-info">
        <div class="streak-count"><span id="streakNumber">0</span> day streak</div>
        <div class="streak-caption" id="streakCaption">Well done! Don't lose the streak</div>
      </div>
    </div>
  </div>

  <!-- Day info popup -->
  <div class="popup-overlay" id="dayPopupOverlay">
    <div class="popup-box day-popup-box" id="dayPopupBox">
      <button class="popup-close-x" id="popupCloseX" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div class="popup-icon" id="dayPopupIcon"></div>
      <div class="popup-title" id="dayPopupTitle">Day</div>
      <div class="popup-message" id="dayPopupMessage">Status</div>
      <button class="btn btn-primary btn-full" id="dayPopupActionBtn">Start Workout</button>
    </div>
  </div>

  <div id="loadingState" class="loading-spinner"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/bottom-nav.js"></script>
  <script src="js/activity-tracker.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/flame.js"></script>
  <script src="js/day-lock.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
