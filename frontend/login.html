<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>HERFORM — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/auth.css" />
<link rel="stylesheet" href="css/ui.css" />
<script src="js/theme.js"></script>
<script src="js/ui.js"></script>
</head>
<body>
  <div class="auth-screen">
    <div class="auth-brand">
      <div class="mark">herform</div>
      <div class="tagline">Your 12-week programme, beautifully kept.</div>
    </div>

    <div class="auth-card">
      <div id="authError" class="auth-error"></div>
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="loginBtn">Sign In</button>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login-lock.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('authError');
    const loginBtn = document.getElementById('loginBtn');
    const lock = loginLock.create('herform_user_login_lock');

    // If already logged in, skip straight to dashboard
    api.me().then(({ user }) => {
      if (user.role === 'user') ui.go('index.html');
    }).catch(() => {});

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('show');
      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in...';

      try {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const { user } = await api.login(email, password);

        if (user.role !== 'user') {
          throw new Error('This login is for the personal dashboard only.');
        }
        ui.go('index.html');
      } catch (err) {
        if (err.status === 429) lock.engage(err.retryAfterSeconds || 900);
        errorBox.textContent = err.message;
        errorBox.classList.add('show');
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
