<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>HERFORM Admin — Quotes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/admin.css" />
<link rel="stylesheet" href="css/ui.css" />
<script src="js/theme.js"></script>
<script src="js/ui.js"></script>
<style>
  .quote-row { display:flex; align-items:center; gap:14px; padding: 14px; border-bottom: 1px solid var(--color-border); }
  .quote-row:last-child { border-bottom: none; }
  .quote-icon { width: 38px; height: 38px; border-radius: 999px; background: var(--color-sage-light); display:flex; align-items:center; justify-content:center; color: var(--color-sage-dark); flex-shrink:0; }
  .quote-text { flex: 1; font-size: 0.92rem; }
  .quote-author { color: var(--color-text-muted); font-size: 0.8rem; }
</style>
</head>
<body>
  <div class="admin-shell">
    <div class="main-content">
      <div class="page-header">
        <h1>Motivational Quotes</h1>
        <p>Shown on the home screen with an icon. One quote is picked per day automatically.</p>
      </div>

      <div style="margin-bottom:20px;">
        <button class="btn btn-primary" id="addQuoteBtn">+ Add Quote</button>
      </div>

      <div class="panel" id="quoteList"><div class="loading-spinner"></div></div>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <h3 style="margin-bottom:16px;" id="modalTitle">Add Quote</h3>
      <form id="quoteForm">
        <input type="hidden" id="quoteId" />
        <div class="form-group">
          <label class="form-label">Quote Text</label>
          <textarea class="form-textarea" id="quoteText" rows="3" required></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Author (optional)</label>
          <input class="form-input" id="quoteAuthor" />
        </div>
        <div class="form-group">
          <label class="form-label">Icon</label>
          <select class="form-select" id="quoteIcon">
            <option value="sparkles">Sparkles</option>
            <option value="flame">Flame</option>
            <option value="leaf">Leaf</option>
            <option value="heart">Heart</option>
            <option value="sun">Sun</option>
            <option value="trending-up">Trending Up</option>
            <option value="star">Star</option>
          </select>
        </div>
        <div class="form-group" style="display:flex; align-items:center; gap:8px;">
          <input type="checkbox" id="quoteActive" checked />
          <label for="quoteActive" style="margin-bottom:0;">Active (included in rotation)</label>
        </div>
        <div style="display:flex; gap:10px; margin-top:16px;">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn btn-outline" id="cancelModalBtn">Cancel</button>
          <button type="button" class="btn btn-danger" id="deleteQuoteBtn" style="display:none; margin-left:auto;">Delete</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/sidebar.js"></script>
  <script>
    let quotes = [];

    const ICON_PATHS = {
      sparkles: '<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>',
      flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
      leaf: '<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>',
      heart: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
      sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
      'trending-up': '<path d="m3 17 6-6 4 4 7-8"/><path d="M15 7h5v5"/>',
      star: '<path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/>'
    };

    (async function init() {
      const admin = await requireAdminAuth();
      if (!admin) return;
      renderSidebar('quotes');
      await loadQuotes();
    })();

    async function loadQuotes() {
      const list = document.getElementById('quoteList');
      try {
        const data = await api.getQuotes();
        quotes = data.quotes;

        if (quotes.length === 0) {
          list.innerHTML = `<div class="empty-state">No quotes yet. Add your first one above.</div>`;
          return;
        }

        list.innerHTML = quotes
          .map(
            (q) => `
          <div class="quote-row">
            <div class="quote-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[q.icon] || ICON_PATHS.sparkles}</svg>
            </div>
            <div class="quote-text">
              "${q.text}"
              ${q.author ? `<div class="quote-author">— ${q.author}</div>` : ''}
            </div>
            <span class="badge ${q.active ? 'badge-success' : 'badge-muted'}">${q.active ? 'Active' : 'Inactive'}</span>
            <button class="btn btn-outline btn-sm" onclick="openEditModal('${q._id}')">Edit</button>
          </div>`
          )
          .join('');
      } catch (err) {
        list.innerHTML = `<div class="empty-state">Could not load quotes. ${err.message}</div>`;
      }
    }

    function openEditModal(id) {
      const q = id ? quotes.find((x) => x._id === id) : null;
      document.getElementById('modalTitle').textContent = q ? 'Edit Quote' : 'Add Quote';
      document.getElementById('quoteId').value = q ? q._id : '';
      document.getElementById('quoteText').value = q ? q.text : '';
      document.getElementById('quoteAuthor').value = q ? q.author || '' : '';
      document.getElementById('quoteIcon').value = q ? q.icon : 'sparkles';
      document.getElementById('quoteActive').checked = q ? q.active : true;
      document.getElementById('deleteQuoteBtn').style.display = q ? 'inline-flex' : 'none';
      document.getElementById('modalOverlay').classList.add('show');
    }

    document.getElementById('addQuoteBtn').addEventListener('click', () => openEditModal(null));
    document.getElementById('cancelModalBtn').addEventListener('click', () => {
      document.getElementById('modalOverlay').classList.remove('show');
    });

    document.getElementById('quoteForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('quoteId').value;
      const payload = {
        text: document.getElementById('quoteText').value,
        author: document.getElementById('quoteAuthor').value,
        icon: document.getElementById('quoteIcon').value,
        active: document.getElementById('quoteActive').checked
      };
      try {
        if (id) await api.updateQuote(id, payload);
        else await api.createQuote(payload);
        document.getElementById('modalOverlay').classList.remove('show');
        await loadQuotes();
      } catch (err) {
        ui.alert(err.message);
      }
    });

    document.getElementById('deleteQuoteBtn').addEventListener('click', async () => {
      const id = document.getElementById('quoteId').value;
      if (!(await ui.confirm({ title: 'Delete quote?', message: 'This quote will be removed permanently.', confirmText: 'Delete', tone: 'danger' }))) return;
      try {
        await api.deleteQuote(id);
        document.getElementById('modalOverlay').classList.remove('show');
        await loadQuotes();
      } catch (err) {
        ui.alert(err.message);
      }
    });
  </script>
</body>
</html>
