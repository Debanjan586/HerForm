<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>HERFORM Admin — User Activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/admin.css" />
<link rel="stylesheet" href="css/ui.css" />
<script src="js/theme.js"></script>
<script src="js/ui.js"></script>
</head>
<body>
  <div class="admin-shell">
    <div class="main-content">
      <div class="page-header">
        <h1>User Activity</h1>
        <p>Login and session activity, shown only for users who have given consent.</p>
      </div>

      <div class="panel" style="display:flex; gap:14px; align-items:flex-end;">
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label">From</label>
          <input type="date" class="form-input" id="fromDate" />
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label">To</label>
          <input type="date" class="form-input" id="toDate" />
        </div>
        <button class="btn btn-primary" id="filterBtn">Filter</button>
        <button class="btn btn-outline" id="clearBtn">Clear</button>
      </div>

      <div id="content"><div class="loading-spinner"></div></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/sidebar.js"></script>
  <script>
    (async function init() {
      const admin = await requireAdminAuth();
      if (!admin) return;
      renderSidebar('activity');

      async function load(from, to) {
        const content = document.getElementById('content');
        content.innerHTML = '<div class="loading-spinner"></div>';
        try {
          const { sessions } = await api.getActivity(from, to);

          if (sessions.length === 0) {
            content.innerHTML = `<div class="panel"><div class="empty-state">No consented activity records found for this range.</div></div>`;
            return;
          }

          content.innerHTML = `
            <div class="panel">
              <table>
                <thead>
                  <tr>
                    <th>User</th><th>Login</th><th>Session Start</th><th>Last Activity</th>
                    <th>Session End</th><th>Duration</th><th>End Type</th>
                  </tr>
                </thead>
                <tbody>
                  ${sessions
                    .map((s) => {
                      const endLabel = s.sessionEndAt
                        ? new Date(s.sessionEndAt).toLocaleString()
                        : '<span class="badge badge-muted">Still active / unknown</span>';
                      const endTypeBadge = !s.endType
                        ? ''
                        : s.endType === 'estimated_timeout'
                        ? '<span class="badge badge-warning">Estimated</span>'
                        : '<span class="badge badge-success">Confirmed</span>';
                      const duration = s.estimatedDurationSeconds
                        ? `${Math.round(s.estimatedDurationSeconds / 60)} min`
                        : '—';
                      return `
                        <tr>
                          <td>${s.user ? s.user.name : '—'}<br/><span style="color:var(--color-text-muted);font-size:0.78rem;">${s.user ? s.user.email : ''}</span></td>
                          <td>${new Date(s.loginAt).toLocaleString()}</td>
                          <td>${new Date(s.sessionStartAt).toLocaleString()}</td>
                          <td>${new Date(s.lastActivityAt).toLocaleString()}</td>
                          <td>${endLabel}</td>
                          <td>${duration}</td>
                          <td>${endTypeBadge}</td>
                        </tr>`;
                    })
                    .join('')}
                </tbody>
              </table>
            </div>
            <p style="color:var(--color-text-muted); font-size:0.82rem; margin-top:-10px;">
              Session end times reflect browser events (page hide / tab close) and are best-effort —
              they are not a guarantee of the exact moment a user left the site.
            </p>
          `;
        } catch (err) {
          content.innerHTML = `<div class="panel"><div class="empty-state">Could not load activity. ${err.message}</div></div>`;
        }
      }

      document.getElementById('filterBtn').addEventListener('click', () => {
        load(document.getElementById('fromDate').value, document.getElementById('toDate').value);
      });
      document.getElementById('clearBtn').addEventListener('click', () => {
        document.getElementById('fromDate').value = '';
        document.getElementById('toDate').value = '';
        load();
      });

      load();
    })();
  </script>
</body>
</html>
